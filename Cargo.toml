# Virtual workspace. Members are globbed from programs/ — which is intentionally
# empty in this scaffold, so `cargo` commands only become runnable once the first
# program lands.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
